---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-env
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: {{ .Values.appName }}
  annotations:
    description: "docling-serve env config. Edit data below and redeploy. Empty value = omit (use docling default)."
data:
  # Runtime
  TZ: "Etc/UTC"
  # Headless endpoint — no UI playground; only the REST API under /v1 is used
  # (consumed internally by ComfyUI Studio at docling.<ns>.svc:5001).
  DOCLING_SERVE_ENABLE_UI: "0"
  # Persist HuggingFace-hosted model weights (layout, TableFormer, OCR) to the
  # mounted cache so they download once, not on every restart.
  HF_HOME: "/modelcache/hf"
  # Docling's own artifact cache (models it pre-fetches) — same volume.
  DOCLING_ARTIFACTS_PATH: "/modelcache/docling"
  # Concurrency: how many documents convert in parallel. 1 = predictable RAM.
  DOCLING_SERVE_MAX_SYNC_REQUESTS: "2"
  # NOTE: backend URL/model/prompts/thresholds now live in config.json (mounted
  # at /wrapper/config.json). The LLM backend URL + mode are injected as env in
  # the deployment (LLM_BASE_URL / BACKEND_MODE); the API key from a Secret.
